name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # 專案以 Windows 為主（.bat、os.startfile、微軟正黑體），測試也在 Windows 上跑
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 編輯器測試只用假流程，不需要 torch／demucs 等重型套件
      - run: python -m pip install numpy pillow pytest
      - run: python -m pytest tests
